# Builds the web app and publishes it on GitHub Pages: https://<owner>.github.io/<repo>/
# One-time setup: Settings → Pages → Source: "GitHub Actions" (the repository must be public
# on a free plan). Runs on every push to the default branch, or by hand (Actions → Run).
name: Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Only the default branch publishes (GitHub's Pages environment allows only that).
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # FlightGear aircraft data (GPL) is downloaded and converted at build time, not committed.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: fgdata-${{ hashFiles('packages/converter/src/**') }}
          restore-keys: fgdata-
      - run: pnpm fetch:ask21
      - run: pnpm bundle:ask21
      - run: pnpm bundle:models
      - run: pnpm test
      - run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # SPA-free static site: no Jekyll processing (it would drop files starting with "_").
      - run: touch apps/web/dist/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on (source: GitHub Actions) if it is still off.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
